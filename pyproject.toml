[project]
name = "spam-detection"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "RafatMeraz", email = "razhossain201@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dvc>=3.67.1",
    "ipykernel>=7.4.0",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
    "yaml-1-3>=0.1.0",
]

[project.scripts]
spam-detection = "spam_detection:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
